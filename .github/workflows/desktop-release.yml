name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "发布说明，可留空"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile || (sleep 20 && pnpm install --frozen-lockfile)

      - name: Check types and run test suite
        run: pnpm typecheck && pnpm test

      - name: Build Windows installer
        run: pnpm build && pnpm exec electron-builder --win --x64 --publish never

      - name: Verify desktop UI workflow
        run: pnpm smoke:ui

      - name: Verify main window closes cleanly
        run: pnpm smoke:window-close

      - name: Verify full local mixing workflow
        run: pnpm smoke:workflow:local

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/latest.yml
            release/*.exe.blockmap

  build-mac:
    needs: metadata
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile || (sleep 20 && pnpm install --frozen-lockfile)

      - name: Detect Apple signing and notarization credentials
        id: signing
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${MACOS_CERTIFICATE_P12_BASE64:-}" ] \
            && [ -n "${MACOS_CERTIFICATE_PASSWORD:-}" ] \
            && [ -n "${MACOS_APPLE_ID:-}" ] \
            && [ -n "${MACOS_APPLE_APP_SPECIFIC_PASSWORD:-}" ] \
            && [ -n "${MACOS_APPLE_TEAM_ID:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置完整 Apple 签名信息，将只发布文件名带 UNSIGNED-PREVIEW 的测试包。"
          fi

      - name: Check types and run test suite
        run: pnpm typecheck && pnpm test

      - name: Build signed and notarized macOS installer
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export CSC_IDENTITY_AUTO_DISCOVERY=true
          export CSC_LINK="$MACOS_CERTIFICATE_P12_BASE64"
          export CSC_KEY_PASSWORD="$MACOS_CERTIFICATE_PASSWORD"
          export APPLE_ID="$MACOS_APPLE_ID"
          export APPLE_APP_SPECIFIC_PASSWORD="$MACOS_APPLE_APP_SPECIFIC_PASSWORD"
          export APPLE_TEAM_ID="$MACOS_APPLE_TEAM_ID"
          pnpm build
          pnpm exec electron-builder --mac --arm64 --publish never

      - name: Verify Developer ID signature and notarization ticket
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: bash scripts/check-macos-signing.sh "$(find release -maxdepth 1 -name '*.dmg' -print -quit)"

      - name: Build clearly labeled ad-hoc macOS preview
        if: steps.signing.outputs.signed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          pnpm build
          pnpm exec electron-builder --mac --arm64 --publish never
          app_path="$(find release/mac-arm64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "::error::没有找到待签名的 macOS 应用。"
            exit 1
          fi
          codesign --force --deep --sign - --timestamp=none "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          preview_dir="$RUNNER_TEMP/yibo-mac-preview"
          mkdir -p "$preview_dir"
          pnpm exec electron-builder --mac dmg zip --arm64 --prepackaged "$app_path" --publish never --config.directories.output="$preview_dir"
          version="$(node -p "require('./package.json').version")"
          rm -f release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml
          mv "$preview_dir/YiboBioMixCut-$version-arm64.dmg" "release/YiboBioMixCut-$version-arm64-UNSIGNED-PREVIEW.dmg"
          mv "$preview_dir/YiboBioMixCut-$version-arm64.dmg.blockmap" "release/YiboBioMixCut-$version-arm64-UNSIGNED-PREVIEW.dmg.blockmap"
          mv "$preview_dir/YiboBioMixCut-$version-arm64.zip" "release/YiboBioMixCut-$version-arm64-UNSIGNED-PREVIEW.zip"
          mv "$preview_dir/YiboBioMixCut-$version-arm64.zip.blockmap" "release/YiboBioMixCut-$version-arm64-UNSIGNED-PREVIEW.zip.blockmap"
          cat > release/macOS-UNSIGNED-PREVIEW.txt <<'EOF'
          此包已完成应用结构签名，但没有 Apple Developer ID 和公证票据，仅用于安装验证。
          macOS 可能要求在“系统设置 > 隐私与安全性”中确认打开。正式分发仍需配置 Apple Developer Program 证书。
          EOF

      - name: Verify ad-hoc macOS preview structure
        if: steps.signing.outputs.signed != 'true'
        shell: bash
        run: bash scripts/check-macos-signing.sh "$(find release -maxdepth 1 -name '*-UNSIGNED-PREVIEW.dmg' -print -quit)" --allow-adhoc-preview

      - name: Verify desktop UI workflow
        run: pnpm smoke:ui

      - name: Verify main window closes cleanly
        run: pnpm smoke:window-close

      - name: Verify full local mixing workflow
        run: pnpm smoke:workflow:local

      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.dmg.blockmap
            release/*.zip.blockmap
            release/macOS-UNSIGNED-PREVIEW.txt

  publish-release:
    if: ${{ always() && needs.build-windows.result == 'success' && needs.build-mac.result == 'success' }}
    needs:
      - metadata
      - build-windows
      - build-mac
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || '' }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="${RELEASE_NOTES:-}"
          if [ -z "$NOTES" ] && [ -f CHANGELOG.md ]; then
            NOTES="$(awk -v version="$VERSION" '
              $0 ~ "^##[[:space:]]+v?" version "([[:space:]]|$)" { found = 1; next }
              found && $0 ~ "^##[[:space:]]+" { exit }
              found { print }
            ' CHANGELOG.md | sed '/^[[:space:]]*$/d' || true)"
          fi
          if [ -z "$NOTES" ]; then
            PREVIOUS_TAG="$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)"
            if [ -n "$PREVIOUS_TAG" ]; then
              NOTES="$(git log --pretty=format:'- %s' "${PREVIOUS_TAG}..${TAG}")"
            fi
          fi
          NOTES="${NOTES:-医博生物混剪工具 ${VERSION}}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "医博生物混剪工具 ${VERSION}" --notes "$NOTES" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-artifacts/* --title "医博生物混剪工具 ${VERSION}" --notes "$NOTES" --latest --repo "$GITHUB_REPOSITORY"
          fi
